# docker-compose.yml

services:
  # База данных
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: courses
      POSTGRES_PASSWORD: securepass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courses -d courses"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Бэкенд (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    environment:
      DB_URL: "postgres://courses:securepass@db:5432/courses?sslmode=disable"
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/app/migrations
    command: >
      sh -c "
        echo 'Waiting for DB...' &&
        until pg_isready -h db -U courses -d courses; do sleep 2; done &&
        echo 'Running migrations...' &&
        /usr/local/bin/migrate -path /app/migrations -database $$DB_URL up &&
        echo 'Starting Go server on :8080...' &&
        ./server
      "

  # Фронтенд (React SPA)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
