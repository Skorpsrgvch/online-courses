# docker-compose.yml

services:
  # База данных
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: courses
      POSTGRES_PASSWORD: securepass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courses -d courses"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Бэкенд (Go)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_URL: "postgres://courses:securepass@db:5432/courses?sslmode=disable"
    ports:
      - "8080:8080"  
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for DB...' &&
        until pg_isready -h db -U courses -d courses; do sleep 2; done &&
        echo 'Running migrations...' &&
        migrate -path /root/migrations -database $$DB_URL up &&
        echo 'Starting Go server on :8080...' &&
        ./server
      "

volumes:
  pgdata: